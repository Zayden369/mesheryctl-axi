name: Release Drafter

# Adapted from layer5io/sistent's release-drafter.yml. Maintains the single
# draft GitHub Release whose tag and notes are computed from the PRs merged to
# master (label-driven version bump, see .github/release-drafter.yml).
# Publishing that draft is what triggers the npm publish in release.yml.

on:
  push:
    # our release branch
    branches:
      - master
  # Manual re-draft. Release Drafter recomputes the draft from the merged PRs and
  # their labels, so this is how a mislabelled release is corrected: relabel the
  # merged PR, then re-run this workflow. Without it the drafter only ever runs on
  # a push to master, so relabelling after the fact has no effect.
  workflow_dispatch:

permissions:
  contents: write  # create/update the draft release
  pull-requests: read  # read merged PRs and their labels

jobs:
  update_release_draft:
    if: github.repository == 'meshery-extensions/mesheryctl-axi'
    runs-on: ubuntu-latest
    steps:
      # Drafts your next Release notes as Pull Requests are merged into "master"
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
