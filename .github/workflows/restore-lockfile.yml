name: Restore package-lock

on:
  push:
    branches: [chore/restore-package-lock]
    paths:
      - ".github/workflows/restore-lockfile.yml"
      - "package.json"
      - "Makefile"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/restore-package-lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate package-lock.json
        run: npm install
      - name: Commit lockfile if missing or changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No package-lock.json changes to commit"
          else
            git commit -m "chore: restore package-lock.json for npm ci"
            git push
          fi
