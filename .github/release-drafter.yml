# Adapted from layer5io/sistent's .github/release-drafter.yml.
#
# $RESOLVED_VERSION, not $NEXT_PATCH_VERSION: it is what routes the
# version-resolver below into the drafted tag. With `default: patch` an
# unlabelled PR resolves to the next patch; label a PR `minor` or `major` to
# draft a larger bump. With no previous release, Release Drafter drafts v0.1.0,
# which matches package.json's initial version.
#
# mesheryctl-axi is pre-1.0: a breaking change to the agent-facing output
# contract (renamed TOON fields, changed exit codes, removed commands) is a
# `minor`, not a `major`. See docs/release-procedure.md.
name-template: 'mesheryctl-axi v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels:
      - 'kind/feature'
      - 'kind/enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'kind/fix'
      - 'kind/bugfix'
      - 'kind/bug'
      - 'bug'
  - title: '🧰 Maintenance'
    labels:
      - 'kind/chore'
      - 'area/ci'
      - 'area/test'
      - 'pr/dependencies'
  - title: '📖 Documentation'
    labels:
      - 'area/docs'
      - 'documentation'
  - title: '🔒 Security'
    label: 'security'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
  patch:
    labels:
      - 'patch'
  default: patch
template: |
  ## What's New
  $CHANGES

  ## Contributors

  Thank you to our contributors for making this release possible:
  $CONTRIBUTORS
